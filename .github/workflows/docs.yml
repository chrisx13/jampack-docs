name: docs
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Construire le site + le PDF combiné
        env:
          ENABLE_PDF_EXPORT: '1'
        run: mkdocs build

      - name: Générer les livrables Word (pandoc)
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          mkdir -p site/word
          find docs -name '*.md' | while read -r f; do
            pandoc "$f" -o "site/word/$(basename "${f%.md}").docx"
          done

      - name: Publier les livrables (site + PDF + Word)
        uses: actions/upload-artifact@v4
        with:
          name: jampack-docs
          path: site
